openapi: 3.1.0
info:
  title: Elimara Attendance and Timetable API
  version: 1.0.0
  description: Phase 06 contract proposal. Permissions are enforced by the API; frontend/shared contracts require joint review.
servers:
  - url: /api/v1
paths:
  /schools/{schoolId}/attendance/reasons:
    get:
      operationId: listAttendanceReasons
      parameters: [{$ref: '#/components/parameters/schoolId'}]
      responses:
        '200': {$ref: '#/components/responses/DataList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createAttendanceReason
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '201': {$ref: '#/components/responses/Data'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/attendance/reasons/{reasonId}/deactivate:
    post:
      operationId: deactivateAttendanceReason
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/reasonId'}, {$ref: '#/components/parameters/csrf'}]
      responses:
        '204': {description: Reason deactivated}
        '404': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/attendance/registers:
    get:
      operationId: listAttendanceRegisters
      parameters:
        - {$ref: '#/components/parameters/schoolId'}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/AttendanceType'}}
        - {name: classId, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/limit'}
        - {$ref: '#/components/parameters/offset'}
      responses:
        '200': {$ref: '#/components/responses/PagedData'}
        '400': {$ref: '#/components/responses/Error'}
    post:
      operationId: createAttendanceRegister
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/AttendanceRegister'}
      responses:
        '201': {$ref: '#/components/responses/Data'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/attendance/registers/{registerId}/records:
    get:
      operationId: listAttendanceRecords
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/registerId'}]
      responses:
        '200': {$ref: '#/components/responses/DataList'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      operationId: createAttendanceRecord
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/registerId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/AttendanceRecord'}
      responses:
        '201': {$ref: '#/components/responses/Data'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/attendance/registers/{registerId}/records/{recordId}:
    patch:
      operationId: correctAttendanceRecord
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/registerId'}, {$ref: '#/components/parameters/recordId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/AttendanceCorrection'}
      responses:
        '200': {$ref: '#/components/responses/Data'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/attendance/registers/{registerId}/finalize:
    post:
      operationId: finalizeAttendanceRegister
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/registerId'}, {$ref: '#/components/parameters/csrf'}]
      responses:
        '200': {$ref: '#/components/responses/Data'}
        '404': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/attendance/summary:
    get:
      operationId: getAttendanceSummary
      parameters:
        - {$ref: '#/components/parameters/schoolId'}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/AttendanceType'}}
        - {name: classId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/DataList'}
        '400': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/timetable-periods:
    get:
      operationId: listTimetablePeriods
      parameters: [{$ref: '#/components/parameters/schoolId'}]
      responses:
        '200': {$ref: '#/components/responses/DataList'}
    post:
      operationId: createTimetablePeriod
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/Period'}
      responses:
        '201': {$ref: '#/components/responses/Data'}
        '400': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/rooms:
    get:
      operationId: listRooms
      parameters: [{$ref: '#/components/parameters/schoolId'}]
      responses:
        '200': {$ref: '#/components/responses/DataList'}
    post:
      operationId: createRoom
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/Room'}
      responses:
        '201': {$ref: '#/components/responses/Data'}
  /schools/{schoolId}/staff/{staffId}/availability:
    get:
      operationId: listStaffAvailability
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/staffId'}]
      responses:
        '200': {$ref: '#/components/responses/DataList'}
    post:
      operationId: addStaffAvailability
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/staffId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/Availability'}
      responses:
        '201': {$ref: '#/components/responses/Data'}
        '409': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/academic-years/{academicYearId}/timetables:
    get:
      operationId: listTimetables
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/academicYearId'}]
      responses:
        '200': {$ref: '#/components/responses/DataList'}
    post:
      operationId: createTimetable
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/academicYearId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/Timetable'}
      responses:
        '201': {$ref: '#/components/responses/Data'}
  /schools/{schoolId}/timetables/{timetableId}/lessons:
    get:
      operationId: listTimetableLessons
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/timetableId'}]
      responses:
        '200': {$ref: '#/components/responses/DataList'}
    post:
      operationId: createTimetableLesson
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/timetableId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/Lesson'}
      responses:
        '201': {$ref: '#/components/responses/Data'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/timetables/{timetableId}/lessons/{lessonId}:
    patch:
      operationId: updateTimetableLesson
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/timetableId'}, {$ref: '#/components/parameters/lessonId'}, {$ref: '#/components/parameters/csrf'}]
      requestBody: {$ref: '#/components/requestBodies/Lesson'}
      responses:
        '200': {$ref: '#/components/responses/Data'}
        '409': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/timetables/{timetableId}/publish:
    post:
      operationId: publishTimetable
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/timetableId'}, {$ref: '#/components/parameters/csrf'}]
      responses:
        '200': {$ref: '#/components/responses/Data'}
        '409': {$ref: '#/components/responses/Error'}
  /schools/{schoolId}/timetables/{timetableId}/unpublish:
    post:
      operationId: unpublishTimetable
      parameters: [{$ref: '#/components/parameters/schoolId'}, {$ref: '#/components/parameters/timetableId'}, {$ref: '#/components/parameters/csrf'}]
      responses:
        '200': {$ref: '#/components/responses/Data'}
        '404': {$ref: '#/components/responses/Error'}
components:
  parameters:
    schoolId: {name: schoolId, in: path, required: true, schema: {type: string, format: uuid}}
    reasonId: {name: reasonId, in: path, required: true, schema: {type: string, format: uuid}}
    registerId: {name: registerId, in: path, required: true, schema: {type: string, format: uuid}}
    recordId: {name: recordId, in: path, required: true, schema: {type: string, format: uuid}}
    staffId: {name: staffId, in: path, required: true, schema: {type: string, format: uuid}}
    academicYearId: {name: academicYearId, in: path, required: true, schema: {type: string, format: uuid}}
    timetableId: {name: timetableId, in: path, required: true, schema: {type: string, format: uuid}}
    lessonId: {name: lessonId, in: path, required: true, schema: {type: string, format: uuid}}
    csrf: {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
    limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 100}}, additionalProperties: false}
    AttendanceRegister:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [academicYearId, date, type]
            properties:
              academicYearId: {type: string, format: uuid}
              date: {type: string, format: date}
              type: {$ref: '#/components/schemas/AttendanceType'}
              classId: {type: string, format: uuid}
              streamId: {type: string, format: uuid}
              timetableLessonId: {type: string, format: uuid}
            additionalProperties: false
    AttendanceRecord:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              studentId: {type: string, format: uuid}
              staffId: {type: string, format: uuid}
              status: {$ref: '#/components/schemas/AttendanceStatus'}
              reasonId: {type: [string, 'null'], format: uuid}
              arrivalAt: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
              departureAt: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
            additionalProperties: false
    AttendanceCorrection:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: {$ref: '#/components/schemas/AttendanceStatus'}
              reasonId: {type: [string, 'null'], format: uuid}
              arrivalAt: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
              departureAt: {type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
            additionalProperties: false
    Period:
      required: true
      content:
        application/json:
          schema: {type: object, required: [name, position, startsAt, endsAt], properties: {name: {type: string}, position: {type: integer, minimum: 1}, startsAt: {$ref: '#/components/schemas/Time'}, endsAt: {$ref: '#/components/schemas/Time'}}, additionalProperties: false}
    Room:
      required: true
      content:
        application/json:
          schema: {type: object, required: [name, capacity], properties: {name: {type: string}, capacity: {type: integer, minimum: 1}}, additionalProperties: false}
    Availability:
      required: true
      content:
        application/json:
          schema: {type: object, required: [weekday, startsAt, endsAt], properties: {weekday: {$ref: '#/components/schemas/Weekday'}, startsAt: {$ref: '#/components/schemas/Time'}, endsAt: {$ref: '#/components/schemas/Time'}}, additionalProperties: false}
    Timetable:
      required: true
      content:
        application/json:
          schema: {type: object, required: [name], properties: {name: {type: string}}, additionalProperties: false}
    Lesson:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [classId, classSubjectAssignmentId, staffId, weekday, startPeriodId, endPeriodId]
            properties:
              classId: {type: string, format: uuid}
              streamId: {type: string, format: uuid}
              classSubjectAssignmentId: {type: string, format: uuid}
              staffId: {type: string, format: uuid}
              roomId: {type: string, format: uuid}
              weekday: {$ref: '#/components/schemas/Weekday'}
              startPeriodId: {type: string, format: uuid}
              endPeriodId: {type: string, format: uuid}
            additionalProperties: false
  schemas:
    AttendanceType: {type: string, enum: [STUDENT_DAILY, STUDENT_LESSON, STAFF_DAILY]}
    AttendanceStatus: {type: string, enum: [PRESENT, ABSENT, LATE, EARLY_DEPARTURE]}
    Weekday: {type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]}
    Time: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'}
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
      required: [error]
    Data: {type: object, required: [data], properties: {data: {type: object}}}
    DataList: {type: object, required: [data], properties: {data: {type: array, items: {type: object}}}}
    PagedData:
      type: object
      required: [data, meta]
      properties:
        data: {type: array, items: {type: object}}
        meta:
          type: object
          properties:
            limit: {type: integer}
            offset: {type: integer}
            total: {type: integer}
  responses:
    Data: {description: Successful operation, content: {application/json: {schema: {$ref: '#/components/schemas/Data'}}}}
    DataList: {description: Successful list operation, content: {application/json: {schema: {$ref: '#/components/schemas/DataList'}}}}
    PagedData: {description: Successful paginated list, content: {application/json: {schema: {$ref: '#/components/schemas/PagedData'}}}}
    Error: {description: API error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
