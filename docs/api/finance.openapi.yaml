openapi: 3.1.0
info:
  title: Elimara Fees and Finance API
  version: 1.0.0
  description: Phase 08 contract proposal. Permission grants are not seeded; review with frontend before sharing DTOs.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /schools/{schoolId}/finance/fee-structures:
    get:
      operationId: listFeeStructures
      description: Requires finance.fees.read.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createFeeStructure
      description: Requires finance.fees.manage. Active same-school year, term, and class are required.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeeStructureInput' }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/finance/fee-structures/{feeStructureId}/deactivate:
    post:
      operationId: deactivateFeeStructure
      description: Requires finance.fees.manage. Historical charges are retained.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/feeStructureId'
        - $ref: '#/components/parameters/csrf'
      responses:
        '204': { description: Fee structure deactivated }
        '404': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/finance/accounts:
    get:
      operationId: listFinancialAccounts
      description: Requires finance.accounts.read.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '403': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/students/{studentId}/finance/account:
    get:
      operationId: getFinancialAccount
      description: Requires finance.accounts.read. All amounts are exact decimal strings in KES.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/studentId'
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/students/{studentId}/finance/charges:
    get:
      operationId: listStudentCharges
      description: Requires finance.accounts.read.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/studentId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: postStudentCharge
      description: Requires finance.charges.post. Requires active placement in the fee structure's class and academic year.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/studentId'
        - $ref: '#/components/parameters/csrf'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [feeStructureId]
              properties:
                feeStructureId: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/students/{studentId}/finance/payments:
    get:
      operationId: listStudentPayments
      description: Requires finance.payments.read.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/studentId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { $ref: '#/components/responses/Page' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: recordManualPayment
      description: Requires finance.payments.record. Staff must verify payment independently before recording. Creates payment and receipt atomically.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/studentId'
        - $ref: '#/components/parameters/csrf'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/finance/payments/{paymentId}/allocations:
    post:
      operationId: allocatePayment
      description: Requires finance.adjustments.manage. Allocation cannot exceed unapplied payment amount or charge outstanding.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/paymentId'
        - $ref: '#/components/parameters/csrf'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [chargeId, amount]
              properties:
                chargeId: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/PositiveAmount' }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/finance/allocations/{allocationId}/reverse:
    post:
      operationId: reversePaymentAllocation
      description: Requires finance.adjustments.manage. Appends a reasoned partial or full reversal.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/allocationId'
        - $ref: '#/components/parameters/csrf'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonedAmountInput' }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/finance/charges/{chargeId}/reverse:
    post:
      operationId: reverseStudentCharge
      description: Requires finance.adjustments.manage. Full reversal only, after net allocations reach zero.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/chargeId'
        - $ref: '#/components/parameters/csrf'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/students/{studentId}/finance/adjustments:
    post:
      operationId: createFinancialAdjustment
      description: Requires finance.adjustments.manage.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/studentId'
        - $ref: '#/components/parameters/csrf'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [direction, amount, reason]
              properties:
                direction: { type: string, enum: [DEBIT, CREDIT] }
                amount: { $ref: '#/components/schemas/PositiveAmount' }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/finance/payments/{paymentId}/refunds:
    post:
      operationId: recordVerifiedRefund
      description: Requires finance.refunds.manage. Records a verified refund; amount cannot exceed unapplied payment funds.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/paymentId'
        - $ref: '#/components/parameters/csrf'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, reference, reason]
              properties:
                amount: { $ref: '#/components/schemas/PositiveAmount' }
                reference: { type: string, minLength: 1, maxLength: 120 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '409': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/finance/payments/{paymentId}/reconciliation:
    post:
      operationId: reconcilePayment
      description: Requires finance.payments.reconcile. Mismatches are retained as exceptions; this does not contact providers or parse statements.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/paymentId'
        - $ref: '#/components/parameters/csrf'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statementAmount, note]
              properties:
                statementAmount: { $ref: '#/components/schemas/Amount' }
                statementReference: { type: string, minLength: 1, maxLength: 120 }
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/finance/reconciliation/exceptions:
    get:
      operationId: listReconciliationExceptions
      description: Requires finance.payments.reconcile. Includes historical exception observations.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { $ref: '#/components/responses/Page' }
  /schools/{schoolId}/finance/receipts/{receiptId}:
    get:
      operationId: getFinancialReceipt
      description: Requires finance.receipts.read.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - $ref: '#/components/parameters/receiptId'
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '404': { $ref: '#/components/responses/Error' }
  /schools/{schoolId}/finance/reports/summary:
    get:
      operationId: getFinancialSummaryReport
      description: Requires finance.reports.read. from/to are inclusive UTC dates; current balances are as of report execution.
      parameters:
        - $ref: '#/components/parameters/schoolId'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200': { $ref: '#/components/responses/Data' }
        '400': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: elimara_session
  parameters:
    schoolId:
      name: schoolId
      in: path
      required: true
      schema: { type: string, format: uuid }
    studentId:
      name: studentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    feeStructureId:
      name: feeStructureId
      in: path
      required: true
      schema: { type: string, format: uuid }
    paymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    chargeId:
      name: chargeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    allocationId:
      name: allocationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    receiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
  schemas:
    Amount:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,2})?$'
      description: Exact KES decimal text, with up to two fractional places; never a JSON number.
      example: '2500.00'
    PositiveAmount:
      type: string
      pattern: '^(?=.*[1-9])(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,2})?$'
      description: Amount greater than zero.
    FeeStructureInput:
      type: object
      additionalProperties: false
      required: [academicYearId, termId, classId, name, items]
      properties:
        academicYearId: { type: string, format: uuid }
        termId: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [name, amount]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              amount: { $ref: '#/components/schemas/PositiveAmount' }
    PaymentInput:
      type: object
      additionalProperties: false
      required: [amount, method]
      properties:
        amount: { $ref: '#/components/schemas/PositiveAmount' }
        method: { type: string, minLength: 1, maxLength: 40 }
        reference: { type: string, minLength: 1, maxLength: 120 }
    ReasonedAmountInput:
      type: object
      additionalProperties: false
      required: [amount, reason]
      properties:
        amount: { $ref: '#/components/schemas/PositiveAmount' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    FeeStructure:
      type: object
      required: [id, academicYearId, termId, classId, name, status, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        termId: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [id, name, amount, position]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              amount: { $ref: '#/components/schemas/Amount' }
              position: { type: integer }
    FinancialAccountSummary:
      type: object
      required: [accountId, studentId, admissionNumber, studentGivenName, studentFamilyName, totalCharges, totalChargeReversals, totalPayments, totalRefunds, totalDebits, totalCredits, totalAllocated, totalAllocationReversals, outstandingCharges, unappliedCredit, balanceDue, netBalance, createdAt]
      properties:
        accountId: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        admissionNumber: { type: string }
        studentGivenName: { type: string }
        studentFamilyName: { type: string }
        totalCharges: { $ref: '#/components/schemas/Amount' }
        totalChargeReversals: { $ref: '#/components/schemas/Amount' }
        totalPayments: { $ref: '#/components/schemas/Amount' }
        totalRefunds: { $ref: '#/components/schemas/Amount' }
        totalDebits: { $ref: '#/components/schemas/Amount' }
        totalCredits: { $ref: '#/components/schemas/Amount' }
        totalAllocated: { $ref: '#/components/schemas/Amount' }
        totalAllocationReversals: { $ref: '#/components/schemas/Amount' }
        outstandingCharges: { $ref: '#/components/schemas/Amount' }
        unappliedCredit: { $ref: '#/components/schemas/Amount' }
        balanceDue: { $ref: '#/components/schemas/Amount' }
        netBalance: { type: string, description: Signed KES decimal string. }
        createdAt: { type: string, format: date-time }
    FinancialCharge:
      type: object
      required: [id, studentId, feeStructureId, structureName, totalAmount, allocatedAmount, allocationReversedAmount, outstandingAmount, reversed, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        feeStructureId: { type: string, format: uuid }
        structureName: { type: string }
        totalAmount: { $ref: '#/components/schemas/Amount' }
        allocatedAmount: { $ref: '#/components/schemas/Amount' }
        allocationReversedAmount: { $ref: '#/components/schemas/Amount' }
        outstandingAmount: { $ref: '#/components/schemas/Amount' }
        reversed: { type: boolean }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [id, name, amount, position]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              amount: { $ref: '#/components/schemas/Amount' }
              position: { type: integer }
    FinancialPayment:
      type: object
      required: [id, studentId, amount, method, reference, receivedAt, receiptId, allocatedAmount, allocationReversedAmount, refundedAmount, unappliedAmount]
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        method: { type: string }
        reference: { type: [string, 'null'] }
        receivedAt: { type: string, format: date-time }
        receiptId: { type: string, format: uuid }
        allocatedAmount: { $ref: '#/components/schemas/Amount' }
        allocationReversedAmount: { $ref: '#/components/schemas/Amount' }
        refundedAmount: { $ref: '#/components/schemas/Amount' }
        unappliedAmount: { $ref: '#/components/schemas/Amount' }
    PaymentAllocation:
      type: object
      required: [id, paymentId, chargeId, amount, reversedAmount, createdAt]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Amount' }
        reversedAmount: { $ref: '#/components/schemas/Amount' }
        createdAt: { type: string, format: date-time }
    PaymentReconciliation:
      type: object
      required: [id, paymentId, paymentAmount, statementAmount, statementReference, outcome, note, createdAt]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        paymentAmount: { $ref: '#/components/schemas/Amount' }
        statementAmount: { $ref: '#/components/schemas/Amount' }
        statementReference: { type: [string, 'null'] }
        outcome: { type: string, enum: [MATCHED, EXCEPTION] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    FinanceReport:
      type: object
      required: [from, to, paymentsReceived, paymentCount, chargeCount, outstandingCharges, unappliedCredit, reconciliationExceptionCount]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        paymentsReceived: { $ref: '#/components/schemas/Amount' }
        paymentCount: { type: integer }
        chargeCount: { type: integer }
        outstandingCharges: { $ref: '#/components/schemas/Amount' }
        unappliedCredit: { $ref: '#/components/schemas/Amount' }
        reconciliationExceptionCount: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            issues:
              type: array
              items:
                type: object
                required: [path, code, message]
                properties:
                  path: { type: string }
                  code: { type: string }
                  message: { type: string }
  responses:
    Data:
      description: Successful resource response
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                oneOf:
                  - $ref: '#/components/schemas/FeeStructure'
                  - $ref: '#/components/schemas/FinancialAccountSummary'
                  - $ref: '#/components/schemas/FinancialCharge'
                  - $ref: '#/components/schemas/FinancialPayment'
                  - $ref: '#/components/schemas/PaymentAllocation'
                  - $ref: '#/components/schemas/PaymentReconciliation'
                  - $ref: '#/components/schemas/FinanceReport'
    Page:
      description: Successful paginated response
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/FeeStructure'
                    - $ref: '#/components/schemas/FinancialAccountSummary'
                    - $ref: '#/components/schemas/FinancialCharge'
                    - $ref: '#/components/schemas/FinancialPayment'
                    - $ref: '#/components/schemas/PaymentAllocation'
                    - $ref: '#/components/schemas/PaymentReconciliation'
              meta:
                type: object
                required: [limit, offset, total]
                properties:
                  limit: { type: integer }
                  offset: { type: integer }
                  total: { type: integer }
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
